<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders – Zipp</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .orders-wrap { max-width: 900px; margin: 40px auto; padding: 0 24px; }
    .order-card { background: white; border-radius: 20px; border: 1.5px solid var(--border); margin-bottom: 20px; overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow .2s; }
    .order-card:hover { box-shadow: var(--shadow-md); }
    .order-card-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .order-header-left { display: flex; flex-direction: column; gap: 4px; }
    .order-number-text { font-family: var(--font-display); font-size: 15px; font-weight: 700; }
    .order-date { font-size: 12px; color: var(--text-muted); }
    .order-card-body { padding: 20px 24px; }
    .order-items-preview { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .order-preview-img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--bg); border: 1px solid var(--border); }
    .order-preview-more { width: 56px; height: 56px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text-muted); }
    .order-meta-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .order-total-text { font-size: 16px; font-weight: 700; }
    .order-actions { display: flex; gap: 10px; }
    .view-btn { padding: 8px 18px; background: var(--primary-light); color: var(--primary); border-radius: 10px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; font-family: var(--font-body); transition: all .2s; }
    .view-btn:hover { background: var(--primary); color: white; }
    .cancel-btn { padding: 8px 18px; background: #fef2f2; color: var(--red); border-radius: 10px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; font-family: var(--font-body); transition: all .2s; }
    .cancel-btn:hover { background: var(--red); color: white; }
    .tracking-timeline { padding: 0 24px 20px; }
    .timeline { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; padding-bottom: 8px; }
    .tl-step { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 80px; position: relative; }
    .tl-step:not(:last-child)::after { content: ''; position: absolute; top: 18px; left: 50%; width: 100%; height: 2px; background: var(--border); z-index: 0; }
    .tl-step.done:not(:last-child)::after { background: var(--green); }
    .tl-dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); background: white; display: flex; align-items: center; justify-content: center; font-size: 16px; z-index: 1; position: relative; }
    .tl-step.done .tl-dot { background: var(--green); border-color: var(--green); }
    .tl-step.active .tl-dot { background: var(--primary); border-color: var(--primary); animation: pulse-dot 1.5s infinite; }
    .tl-label { font-size: 10px; font-weight: 600; color: var(--text-muted); margin-top: 6px; text-align: center; line-height: 1.3; }
    .tl-step.done .tl-label, .tl-step.active .tl-label { color: var(--text-primary); }
    @keyframes pulse-dot { 0%,100%{box-shadow:0 0 0 0 rgba(108,59,255,.4)} 50%{box-shadow:0 0 0 8px rgba(108,59,255,0)} }
    .empty-orders { text-align: center; padding: 80px 20px; }
    .empty-orders .icon { font-size: 72px; margin-bottom: 20px; }
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .filter-tab { padding: 8px 18px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 13px; font-weight: 600; cursor: pointer; background: white; font-family: var(--font-body); color: var(--text-secondary); transition: all .2s; }
    .filter-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .order-detail-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 24px; display: none; }
    .order-detail-modal.open { display: flex; }
    .order-detail-box { background: white; border-radius: 24px; width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; box-shadow: 0 40px 80px rgba(0,0,0,.3); }
    .odm-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; }
    .odm-body { padding: 24px; }
    .detail-row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .detail-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="logo-icon">⚡</span><span class="logo-text">Zipp</span></a>
    <div class="nav-actions">
      <a href="/pages/login.html" class="nav-btn nav-login" id="loginBtn"><span>👤</span> Login</a>
      <div class="nav-user hidden" id="userMenu">
        <button class="nav-user-btn" onclick="toggleUserDropdown()">
          <span class="user-avatar" id="userAvatar">J</span>
          <span id="userName">John</span> ▾
        </button>
        <div class="user-dropdown hidden" id="userDropdown">
          <a href="/pages/profile.html">👤 My Profile</a>
          <a href="/pages/orders.html">📦 My Orders</a>
          <a href="/pages/wishlist.html">❤️ Wishlist</a>
          <hr/><button onclick="logout()">🚪 Logout</button>
        </div>
      </div>
      <a href="/pages/cart.html" class="nav-cart"><span>🛒</span><span class="cart-badge" id="cartBadge">0</span></a>
    </div>
  </div>
</nav>

<div class="orders-wrap">
  <div class="page-header">
    <h1 class="page-title">📦 My Orders</h1>
    <p class="page-subtitle">Track and manage your orders</p>
  </div>

  <div class="filter-tabs">
    <button class="filter-tab active" onclick="filterOrders('all', this)">All Orders</button>
    <button class="filter-tab" onclick="filterOrders('placed', this)">Placed</button>
    <button class="filter-tab" onclick="filterOrders('out_for_delivery', this)">Out for Delivery</button>
    <button class="filter-tab" onclick="filterOrders('delivered', this)">Delivered</button>
    <button class="filter-tab" onclick="filterOrders('cancelled', this)">Cancelled</button>
  </div>

  <div id="ordersContainer"></div>
</div>

<!-- ORDER DETAIL MODAL -->
<div class="order-detail-modal" id="orderDetailModal">
  <div class="order-detail-box">
    <div class="odm-header">
      <h3 style="font-family:var(--font-display);font-size:18px;font-weight:700">Order Details</h3>
      <button onclick="closeOrderDetail()" style="font-size:20px;color:var(--text-muted);background:none;border:none;cursor:pointer">✕</button>
    </div>
    <div class="odm-body" id="orderDetailBody"></div>
  </div>
</div>

<div id="toastContainer"></div>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script>
  const STATUS_STEPS = [
    { key: 'placed', label: 'Placed', icon: '📋' },
    { key: 'confirmed', label: 'Confirmed', icon: '✅' },
    { key: 'packed', label: 'Packed', icon: '📦' },
    { key: 'picked', label: 'Picked', icon: '🏍️' },
    { key: 'out_for_delivery', label: 'On the Way', icon: '🚀' },
    { key: 'delivered', label: 'Delivered', icon: '🏠' }
  ];

  let allOrders = [];
  let activeFilter = 'all';

  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    updateNavAuth();
    await loadOrders();
  });

  async function loadOrders() {
    const container = document.getElementById('ordersContainer');
    container.innerHTML = skeletonGrid(3, '180px');
    try {
      const res = await OrderAPI.getAll();
      allOrders = res.orders || [];
      renderOrders(allOrders);
    } catch(e) {
      container.innerHTML = '<p style="color:var(--red);text-align:center;padding:40px">Error loading orders.</p>';
    }
  }

  function filterOrders(status, btn) {
    activeFilter = status;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const filtered = status === 'all' ? allOrders : allOrders.filter(o => o.status === status);
    renderOrders(filtered);
  }

  function renderOrders(orders) {
    const container = document.getElementById('ordersContainer');
    if (!orders.length) {
      container.innerHTML = `<div class="empty-orders">
        <div class="icon">📦</div>
        <h2 style="font-family:var(--font-display);font-size:24px;margin-bottom:8px">No orders yet</h2>
        <p style="color:var(--text-muted);margin-bottom:24px">Start shopping to see your orders here</p>
        <a href="/" class="btn-primary">Start Shopping →</a>
      </div>`;
      return;
    }
    container.innerHTML = orders.map(order => renderOrderCard(order)).join('');
  }

  function renderOrderCard(order) {
    const statusIdx = STATUS_STEPS.findIndex(s => s.key === order.status);
    const isCancelled = order.status === 'cancelled';
    const imgs = (order.items || []).slice(0, 3);
    const extra = (order.items || []).length - 3;

    return `
    <div class="order-card">
      <div class="order-card-header">
        <div class="order-header-left">
          <span class="order-number-text">#${order.orderNumber}</span>
          <span class="order-date">${new Date(order.createdAt).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}</span>
        </div>
        <span class="status-pill status-${order.status}">${order.status.replace(/_/g,' ').toUpperCase()}</span>
      </div>
      <div class="order-card-body">
        <div class="order-items-preview">
          ${imgs.map(item => `<img class="order-preview-img" src="${item.image || 'https://via.placeholder.com/56'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/56'"/>`).join('')}
          ${extra > 0 ? `<div class="order-preview-more">+${extra}</div>` : ''}
        </div>
        <div class="order-meta-row">
          <span class="order-total-text">₹${order.pricing?.total || 0} · ${order.items?.length || 0} item${order.items?.length !== 1 ? 's' : ''}</span>
          <div class="order-actions">
            <button class="view-btn" onclick="viewOrderDetail('${order._id}')">View Details</button>
            ${!isCancelled && !['delivered'].includes(order.status)
              ? `<button class="cancel-btn" onclick="cancelOrder('${order._id}')">Cancel</button>` : ''}
          </div>
        </div>
      </div>
      ${!isCancelled ? `
      <div class="tracking-timeline">
        <div class="timeline">
          ${STATUS_STEPS.map((step, i) => {
            const state = i < statusIdx ? 'done' : i === statusIdx ? 'active' : '';
            return `<div class="tl-step ${state}">
              <div class="tl-dot">${i < statusIdx ? '✓' : step.icon}</div>
              <span class="tl-label">${step.label}</span>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}
    </div>`;
  }

  async function viewOrderDetail(id) {
    const order = allOrders.find(o => o._id === id);
    if (!order) return;
    const modal = document.getElementById('orderDetailModal');
    const body = document.getElementById('orderDetailBody');
    body.innerHTML = `
      <h4 style="font-family:var(--font-display);margin-bottom:16px">Items Ordered</h4>
      ${(order.items || []).map(item => `
        <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
          <img src="${item.image || 'https://via.placeholder.com/50'}" style="width:50px;height:50px;border-radius:10px;object-fit:cover"/>
          <div style="flex:1"><div style="font-weight:600;font-size:14px">${item.name}</div><div style="font-size:12px;color:var(--text-muted)">Qty: ${item.quantity}</div></div>
          <span style="font-weight:700;color:var(--primary)">₹${item.subtotal}</span>
        </div>`).join('')}
      <h4 style="font-family:var(--font-display);margin:20px 0 14px">Order Summary</h4>
      <div class="detail-row"><span>Subtotal</span><span>₹${order.pricing?.subtotal}</span></div>
      <div class="detail-row"><span>Delivery</span><span>${order.pricing?.deliveryFee === 0 ? 'FREE' : '₹' + order.pricing?.deliveryFee}</span></div>
      <div class="detail-row"><span>Tax</span><span>₹${order.pricing?.tax}</span></div>
      <div class="detail-row" style="font-weight:700"><span>Total</span><span>₹${order.pricing?.total}</span></div>
      <h4 style="font-family:var(--font-display);margin:20px 0 14px">Delivery Address</h4>
      <p style="font-size:14px;color:var(--text-secondary);line-height:1.6">
        ${order.deliveryAddress?.fullName || ''}<br/>
        ${order.deliveryAddress?.addressLine1 || ''}<br/>
        ${order.deliveryAddress?.city} – ${order.deliveryAddress?.pincode}
      </p>
      <div class="detail-row" style="margin-top:16px"><span>Payment</span><span>${order.payment?.method?.toUpperCase()} – <span class="status-pill status-${order.payment?.status === 'paid' ? 'delivered' : 'placed'}">${order.payment?.status}</span></span></div>`;
    modal.classList.add('open');
  }

  function closeOrderDetail() {
    document.getElementById('orderDetailModal').classList.remove('open');
  }

  async function cancelOrder(id) {
    if (!confirm('Cancel this order?')) return;
    try {
      await OrderAPI.cancel(id, 'Cancelled by customer');
      showToast('Order cancelled', 'success');
      await loadOrders();
    } catch(e) { showToast(e.message, 'error'); }
  }
</script>
</body>
</html>
