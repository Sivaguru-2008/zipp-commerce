<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wishlist – Zipp</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .wishlist-wrap { max-width: 1200px; margin: 40px auto; padding: 0 24px; }
    .wishlist-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .empty-wishlist { text-align: center; padding: 80px 20px; }
    .empty-wishlist .icon { font-size: 72px; margin-bottom: 20px; }
    .wishlist-product-card { background: white; border-radius: 20px; border: 1.5px solid var(--border); overflow: hidden; box-shadow: var(--shadow-sm); transition: all .25s; }
    .wishlist-product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .wishlist-img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .wishlist-info { padding: 14px; }
    .wishlist-brand { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .wishlist-name { font-size: 14px; font-weight: 600; margin: 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .wishlist-price { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .wishlist-actions { display: flex; gap: 8px; }
    .wishlist-add-btn { flex: 1; padding: 9px; background: var(--primary); color: white; border-radius: 10px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; font-family: var(--font-body); transition: background .2s; }
    .wishlist-add-btn:hover { background: var(--primary-dark); }
    .wishlist-remove-btn { width: 38px; height: 38px; background: #fef2f2; color: var(--red); border-radius: 10px; border: none; cursor: pointer; font-size: 16px; transition: all .2s; }
    .wishlist-remove-btn:hover { background: var(--red); color: white; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="logo-icon">⚡</span><span class="logo-text">Zipp</span></a>
    <div class="nav-search-wrap">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search products…" autocomplete="off"/>
        <div class="search-suggestions" id="searchSuggestions"></div>
      </div>
    </div>
    <div class="nav-actions">
      <a href="/pages/login.html" class="nav-btn nav-login" id="loginBtn"><span>👤</span> Login</a>
      <div class="nav-user hidden" id="userMenu">
        <button class="nav-user-btn" onclick="toggleUserDropdown()">
          <span class="user-avatar" id="userAvatar">J</span>
          <span id="userName">John</span> ▾
        </button>
        <div class="user-dropdown hidden" id="userDropdown">
          <a href="/pages/profile.html">👤 My Profile</a>
          <a href="/pages/orders.html">📦 My Orders</a>
          <a href="/pages/wishlist.html">❤️ Wishlist</a>
          <hr/><button onclick="logout()">🚪 Logout</button>
        </div>
      </div>
      <a href="/pages/cart.html" class="nav-cart"><span>🛒</span><span class="cart-badge" id="cartBadge">0</span></a>
    </div>
  </div>
</nav>

<div class="wishlist-wrap">
  <div class="wishlist-header-row">
    <div class="page-header" style="margin:0">
      <h1 class="page-title">❤️ My Wishlist</h1>
      <p class="page-subtitle" id="wishlistCount">Loading…</p>
    </div>
    <button class="btn-outline" onclick="addAllToCart()" id="addAllBtn" style="display:none">🛒 Add All to Cart</button>
  </div>

  <div id="wishlistEmpty" class="empty-wishlist" style="display:none">
    <div class="icon">❤️</div>
    <h2 style="font-family:var(--font-display);font-size:24px;margin-bottom:8px">Your wishlist is empty</h2>
    <p style="color:var(--text-muted);margin-bottom:24px">Save products you love and buy them later</p>
    <a href="/" class="btn-primary">Explore Products →</a>
  </div>

  <div class="products-grid" id="wishlistGrid"></div>
</div>

<!-- CART SIDEBAR -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<aside class="cart-sidebar" id="cartSidebar">
  <div class="cart-header"><h3>My Cart 🛒</h3><button class="cart-close" onclick="closeCart()">✕</button></div>
  <div class="cart-body" id="cartBody">
    <div class="cart-empty" id="cartEmpty"><div class="cart-empty-icon">🛒</div><p>Cart is empty</p></div>
    <div class="cart-items" id="cartItems"></div>
  </div>
  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="cart-totals">
      <div class="cart-row"><span>Subtotal</span><span id="cartSubtotal">₹0</span></div>
      <div class="cart-row"><span>Delivery</span><span id="cartDelivery">₹40</span></div>
      <div class="cart-row cart-row-total"><span>Total</span><span id="cartTotal">₹0</span></div>
    </div>
    <a href="/pages/checkout.html" class="btn-primary cart-checkout-btn">Checkout →</a>
  </div>
</aside>
<div id="toastContainer"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script>
  let wishlistProducts = [];

  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    updateNavAuth();
    await loadWishlist();
    loadCart();
    initSearch();
  });

  async function loadWishlist() {
    try {
      const res = await WishlistAPI.get();
      wishlistProducts = res.products || [];
      renderWishlist(wishlistProducts);
    } catch(e) { showToast('Error loading wishlist', 'error'); }
  }

  function renderWishlist(products) {
    const count = products.length;
    document.getElementById('wishlistCount').textContent = `${count} item${count !== 1 ? 's' : ''} saved`;
    document.getElementById('addAllBtn').style.display = count > 0 ? 'inline-flex' : 'none';

    if (!count) {
      document.getElementById('wishlistEmpty').style.display = 'block';
      document.getElementById('wishlistGrid').innerHTML = '';
      return;
    }
    document.getElementById('wishlistEmpty').style.display = 'none';
    document.getElementById('wishlistGrid').innerHTML = products.map(p => `
      <div class="wishlist-product-card" id="wish-${p._id}">
        <img class="wishlist-img" src="${p.images?.[0] || 'https://via.placeholder.com/300'}" alt="${p.name}" onclick="viewProduct('${p._id}')" style="cursor:pointer" onerror="this.src='https://via.placeholder.com/300'"/>
        <div class="wishlist-info">
          <div class="wishlist-brand">${p.brand || ''}</div>
          <div class="wishlist-name" onclick="viewProduct('${p._id}')" style="cursor:pointer">${p.name}</div>
          <div class="wishlist-price">₹${p.price} ${p.mrp > p.price ? `<span style="font-size:12px;color:var(--text-muted);text-decoration:line-through">₹${p.mrp}</span>` : ''}</div>
          <div class="wishlist-actions">
            <button class="wishlist-add-btn" onclick="addWishItemToCart('${p._id}')">🛒 Add to Cart</button>
            <button class="wishlist-remove-btn" onclick="removeWishItem('${p._id}')">🗑️</button>
          </div>
        </div>
      </div>`).join('');
  }

  async function addWishItemToCart(productId) {
    await addToCart(productId, 1);
  }

  async function removeWishItem(productId) {
    try {
      await WishlistAPI.remove(productId);
      wishlistProducts = wishlistProducts.filter(p => p._id !== productId);
      document.getElementById(`wish-${productId}`)?.remove();
      renderWishlist(wishlistProducts);
      showToast('Removed from wishlist', 'success');
    } catch(e) { showToast('Error', 'error'); }
  }

  async function addAllToCart() {
    if (!wishlistProducts.length) return;
    let added = 0;
    for (const p of wishlistProducts) {
      try { await CartAPI.add(p._id, 1); added++; } catch(_) {}
    }
    if (added > 0) {
      showToast(`Added ${added} items to cart! 🛒`, 'success');
      loadCart();
    }
  }
</script>
</body>
</html>
