<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search – Zipp</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .search-layout { display: grid; grid-template-columns: 260px 1fr; gap: 28px; max-width: 1300px; margin: 32px auto; padding: 0 24px; }
    @media(max-width:900px){ .search-layout { grid-template-columns: 1fr; } .sidebar-filters { display: none; } }

    /* Sidebar */
    .sidebar-filters { position: sticky; top: 80px; align-self: start; }
    .filter-panel { background: white; border-radius: 16px; border: 1.5px solid var(--border); overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
    .filter-panel-header { padding: 16px 20px; font-weight: 700; font-size: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .filter-panel-body { padding: 16px 20px; }
    .filter-option { display: flex; align-items: center; gap: 10px; padding: 7px 0; cursor: pointer; font-size: 14px; color: var(--text-secondary); transition: color .2s; }
    .filter-option:hover { color: var(--primary); }
    .filter-option input[type=checkbox] { accent-color: var(--primary); width: 16px; height: 16px; }
    .price-inputs { display: flex; gap: 10px; align-items: center; }
    .price-inputs input { flex: 1; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: var(--font-body); outline: none; }
    .price-inputs input:focus { border-color: var(--primary); }
    .apply-btn { width: 100%; padding: 10px; background: var(--primary); color: white; border-radius: 8px; font-weight: 600; font-size: 14px; margin-top: 12px; font-family: var(--font-body); cursor: pointer; border: none; transition: background .2s; }
    .apply-btn:hover { background: var(--primary-dark); }

    /* Results area */
    .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .results-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
    .results-count { font-size: 13px; color: var(--text-muted); }
    .sort-select { padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: var(--font-body); outline: none; background: white; cursor: pointer; transition: border-color .2s; }
    .sort-select:focus { border-color: var(--primary); }
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-chip { display: flex; align-items: center; gap: 6px; padding: 5px 12px; background: var(--primary-light); color: var(--primary); border-radius: 20px; font-size: 13px; font-weight: 600; }
    .filter-chip button { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 14px; padding: 0; line-height: 1; }
    .no-results { text-align: center; padding: 80px 20px; }
    .no-results-icon { font-size: 64px; margin-bottom: 16px; }
    .no-results h3 { font-family: var(--font-display); font-size: 22px; margin-bottom: 8px; }
    .no-results p { color: var(--text-muted); margin-bottom: 24px; }
    .pagination { display: flex; gap: 8px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
    .page-btn { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--border); background: white; font-weight: 600; font-size: 14px; cursor: pointer; transition: all .2s; font-family: var(--font-body); display: flex; align-items: center; justify-content: center; }
    .page-btn:hover, .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .mobile-filter-btn { display: none; padding: 10px 20px; background: var(--primary); color: white; border-radius: 10px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; font-family: var(--font-body); }
    @media(max-width:900px){ .mobile-filter-btn { display: flex; align-items: center; gap: 8px; } }
  </style>
</head>
<body>
<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="logo-icon">⚡</span><span class="logo-text">Zipp</span></a>
    <div class="nav-search-wrap">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search products…" autocomplete="off"/>
        <div class="search-suggestions" id="searchSuggestions"></div>
      </div>
    </div>
    <div class="nav-actions">
      <a href="/pages/login.html" class="nav-btn nav-login" id="loginBtn"><span>👤</span> Login</a>
      <div class="nav-user hidden" id="userMenu">
        <button class="nav-user-btn" onclick="toggleUserDropdown()">
          <span class="user-avatar" id="userAvatar">J</span>
          <span id="userName">John</span> ▾
        </button>
        <div class="user-dropdown hidden" id="userDropdown">
          <a href="/pages/profile.html">👤 My Profile</a>
          <a href="/pages/orders.html">📦 My Orders</a>
          <a href="/pages/wishlist.html">❤️ Wishlist</a>
          <hr/><button onclick="logout()">🚪 Logout</button>
        </div>
      </div>
      <a href="#" class="nav-cart" onclick="openCart()"><span>🛒</span><span class="cart-badge" id="cartBadge">0</span></a>
    </div>
  </div>
</nav>

<div class="search-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar-filters">
    <div class="filter-panel">
      <div class="filter-panel-header">📂 Categories</div>
      <div class="filter-panel-body" id="catFilterList">
        <div class="skeleton-card" style="height:24px;margin-bottom:8px;border-radius:6px"></div>
        <div class="skeleton-card" style="height:24px;margin-bottom:8px;border-radius:6px"></div>
        <div class="skeleton-card" style="height:24px;border-radius:6px"></div>
      </div>
    </div>
    <div class="filter-panel">
      <div class="filter-panel-header">💰 Price Range</div>
      <div class="filter-panel-body">
        <div class="price-inputs">
          <input type="number" id="priceMin" placeholder="Min ₹" min="0"/>
          <span>–</span>
          <input type="number" id="priceMax" placeholder="Max ₹" min="0"/>
        </div>
        <button class="apply-btn" onclick="applyFilters()">Apply Price Filter</button>
      </div>
    </div>
    <div class="filter-panel">
      <div class="filter-panel-header">⭐ Rating</div>
      <div class="filter-panel-body">
        <label class="filter-option"><input type="radio" name="rating" value="4" onchange="applyFilters()"> 4★ & above</label>
        <label class="filter-option"><input type="radio" name="rating" value="3" onchange="applyFilters()"> 3★ & above</label>
        <label class="filter-option"><input type="radio" name="rating" value="" onchange="applyFilters()"> All</label>
      </div>
    </div>
    <div class="filter-panel">
      <div class="filter-panel-header">🏷️ Discount</div>
      <div class="filter-panel-body">
        <label class="filter-option"><input type="radio" name="discount" value="30" onchange="applyFilters()"> 30% or more</label>
        <label class="filter-option"><input type="radio" name="discount" value="20" onchange="applyFilters()"> 20% or more</label>
        <label class="filter-option"><input type="radio" name="discount" value="10" onchange="applyFilters()"> 10% or more</label>
        <label class="filter-option"><input type="radio" name="discount" value="" onchange="applyFilters()"> All</label>
      </div>
    </div>
    <button class="apply-btn" style="border-radius:12px" onclick="clearAllFilters()">🔄 Clear All Filters</button>
  </aside>

  <!-- RESULTS -->
  <main>
    <div class="results-header">
      <div>
        <div class="results-title" id="resultsTitle">All Products</div>
        <div class="results-count" id="resultsCount">Loading…</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="mobile-filter-btn" onclick="alert('Filters available on desktop')">🔧 Filters</button>
        <select class="sort-select" id="sortSelect" onchange="applyFilters()">
          <option value="">Sort: Relevance</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="discount">Most Discounted</option>
          <option value="rating">Highest Rated</option>
          <option value="newest">Newest First</option>
        </select>
      </div>
    </div>
    <div class="filter-chips" id="filterChips"></div>
    <div class="products-grid" id="productsGrid">
      <div class="skeleton-card" style="height:280px;border-radius:14px"></div>
      <div class="skeleton-card" style="height:280px;border-radius:14px"></div>
      <div class="skeleton-card" style="height:280px;border-radius:14px"></div>
      <div class="skeleton-card" style="height:280px;border-radius:14px"></div>
      <div class="skeleton-card" style="height:280px;border-radius:14px"></div>
      <div class="skeleton-card" style="height:280px;border-radius:14px"></div>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

<!-- CART SIDEBAR -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<aside class="cart-sidebar" id="cartSidebar">
  <div class="cart-header"><h3>My Cart 🛒</h3><button class="cart-close" onclick="closeCart()">✕</button></div>
  <div class="cart-body" id="cartBody">
    <div class="cart-empty" id="cartEmpty"><div class="cart-empty-icon">🛒</div><p>Cart is empty</p></div>
    <div class="cart-items" id="cartItems"></div>
  </div>
  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="cart-totals">
      <div class="cart-row"><span>Subtotal</span><span id="cartSubtotal">₹0</span></div>
      <div class="cart-row"><span>Delivery</span><span id="cartDelivery">₹40</span></div>
      <div class="cart-row cart-row-total"><span>Total</span><span id="cartTotal">₹0</span></div>
    </div>
    <a href="/pages/checkout.html" class="btn-primary cart-checkout-btn">Checkout →</a>
  </div>
</aside>
<div id="toastContainer"></div>

<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script>
  let currentPage = 1;
  let totalPages = 1;
  let activeCategory = null;
  let activeCategoryName = '';
  const LIMIT = 12;

  const params = new URLSearchParams(window.location.search);
  const searchQ = params.get('q') || '';
  const catSlug = params.get('category') || '';

  document.addEventListener('DOMContentLoaded', async () => {
    if (searchQ) {
      document.getElementById('searchInput').value = searchQ;
      document.getElementById('resultsTitle').textContent = `Results for "${searchQ}"`;
    }
    await loadCategories();
    await fetchProducts();
    loadCart();
    initSearch();
  });

  async function loadCategories() {
    try {
      const res = await CategoryAPI.getAll();
      const cats = res.categories || [];
      const container = document.getElementById('catFilterList');
      container.innerHTML = `<label class="filter-option">
        <input type="radio" name="cat" value="" ${!catSlug ? 'checked' : ''} onchange="onCategoryChange('')"> All Categories
      </label>` + cats.map(c => `
        <label class="filter-option">
          <input type="radio" name="cat" value="${c._id}" data-slug="${c.slug}" data-name="${c.name}"
            ${catSlug === c.slug ? 'checked' : ''} onchange="onCategoryChange('${c._id}','${c.name}')">
          ${c.icon || '🛒'} ${c.name}
        </label>`).join('');

      // If category slug in URL, set activeCategory
      if (catSlug) {
        const found = cats.find(c => c.slug === catSlug);
        if (found) { activeCategory = found._id; activeCategoryName = found.name; }
      }
    } catch(e) {}
  }

  function onCategoryChange(id, name = '') {
    activeCategory = id || null;
    activeCategoryName = name;
    currentPage = 1;
    fetchProducts();
  }

  async function fetchProducts() {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = skeletonGrid(LIMIT, '280px');

    const query = { page: currentPage, limit: LIMIT };
    if (searchQ) query.q = searchQ;
    if (activeCategory) query.category = activeCategory;

    const minP = document.getElementById('priceMin')?.value;
    const maxP = document.getElementById('priceMax')?.value;
    if (minP) query.minPrice = minP;
    if (maxP) query.maxPrice = maxP;

    const sort = document.getElementById('sortSelect')?.value;
    if (sort) query.sort = sort;

    const rating = document.querySelector('input[name=rating]:checked')?.value;
    if (rating) query.minRating = rating;

    const discount = document.querySelector('input[name=discount]:checked')?.value;
    if (discount) query.minDiscount = discount;

    try {
      const res = await ProductAPI.getAll(query);
      const products = res.products || [];
      totalPages = res.pages || 1;
      const total = res.total || 0;

      const titleEl = document.getElementById('resultsTitle');
      if (activeCategoryName) titleEl.textContent = activeCategoryName;
      else if (searchQ) titleEl.textContent = `Results for "${searchQ}"`;
      else titleEl.textContent = 'All Products';

      document.getElementById('resultsCount').textContent = `${total} product${total !== 1 ? 's' : ''} found`;

      if (!products.length) {
        grid.innerHTML = `<div class="no-results" style="grid-column:1/-1">
          <div class="no-results-icon">🔍</div>
          <h3>No products found</h3>
          <p>Try different keywords or remove filters</p>
          <button class="btn-primary" onclick="clearAllFilters()">Clear Filters</button>
        </div>`;
      } else {
        grid.innerHTML = products.map(buildProductCard).join('');
      }
      renderPagination();
      updateFilterChips();
    } catch(e) {
      grid.innerHTML = `<p style="grid-column:1/-1;color:var(--red);padding:40px;text-align:center">Error loading products. Make sure the server is running.</p>`;
    }
  }

  function applyFilters() { currentPage = 1; fetchProducts(); }

  function clearAllFilters() {
    document.querySelectorAll('input[name=cat]')[0]?.click();
    document.getElementById('priceMin').value = '';
    document.getElementById('priceMax').value = '';
    document.querySelectorAll('input[name=rating]').forEach(r => r.checked = false);
    document.querySelectorAll('input[name=discount]').forEach(r => r.checked = false);
    document.getElementById('sortSelect').value = '';
    activeCategory = null; activeCategoryName = '';
    currentPage = 1;
    fetchProducts();
  }

  function updateFilterChips() {
    const chips = [];
    if (activeCategoryName) chips.push({ label: activeCategoryName, clear: () => { activeCategory = null; activeCategoryName = ''; applyFilters(); } });
    const min = document.getElementById('priceMin')?.value;
    const max = document.getElementById('priceMax')?.value;
    if (min || max) chips.push({ label: `₹${min || 0} – ₹${max || '∞'}`, clear: () => { document.getElementById('priceMin').value=''; document.getElementById('priceMax').value=''; applyFilters(); } });
    document.getElementById('filterChips').innerHTML = chips.map((c, i) =>
      `<div class="filter-chip">${c.label}<button onclick="clearChip(${i})">✕</button></div>`
    ).join('');
    window._chipClears = chips.map(c => c.clear);
  }
  function clearChip(i) { window._chipClears[i]?.(); }

  function renderPagination() {
    if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
    let html = '';
    if (currentPage > 1) html += `<button class="page-btn" onclick="goPage(${currentPage-1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      } else if (i === currentPage - 3 || i === currentPage + 3) {
        html += `<span style="padding:0 4px;line-height:40px">…</span>`;
      }
    }
    if (currentPage < totalPages) html += `<button class="page-btn" onclick="goPage(${currentPage+1})">›</button>`;
    document.getElementById('pagination').innerHTML = html;
  }

  function goPage(p) { currentPage = p; fetchProducts(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
</script>
</body>
</html>
