<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Zipp</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { background: linear-gradient(135deg, #1a0935 0%, #2d1066 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card { background: white; border-radius: 28px; padding: 48px 40px; width: 100%; max-width: 440px; box-shadow: 0 40px 80px rgba(0,0,0,.3); }
    .auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; justify-content: center; }
    .auth-logo .logo-text { font-family: var(--font-display); font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .auth-title { font-family: var(--font-display); font-size: 26px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .auth-sub { color: var(--text-muted); text-align: center; font-size: 14px; margin-bottom: 32px; }
    .auth-tabs { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 28px; }
    .auth-tab { flex: 1; padding: 10px; text-align: center; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; color: var(--text-muted); border: none; background: none; font-family: var(--font-body); }
    .auth-tab.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .form-panel { display: none; }
    .form-panel.active { display: block; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-muted); font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    #toastContainer { position: fixed; top: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">
    <span style="font-size:28px">⚡</span>
    <span class="logo-text">Zipp</span>
  </div>

  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">Login</button>
    <button class="auth-tab" onclick="switchTab('register')">Register</button>
  </div>

  <!-- LOGIN FORM -->
  <div class="form-panel active" id="loginPanel">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Your password" />
    </div>
    <button class="btn-primary" style="width:100%;margin-top:8px" onclick="handleLogin()" id="loginBtn">
      Login to Zipp →
    </button>
    <div class="auth-footer">
      <a href="#" onclick="switchTab('register')">Don't have an account? Register</a>
    </div>
    <div class="divider">or try</div>
    <button class="btn-outline" style="width:100%;font-size:13px" onclick="demoLogin('user')">
      👤 Demo User Login
    </button>
    <button class="btn-outline" style="width:100%;margin-top:8px;font-size:13px" onclick="demoLogin('admin')">
      🔐 Demo Admin Login
    </button>
  </div>

  <!-- REGISTER FORM -->
  <div class="form-panel" id="registerPanel">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" placeholder="John Doe" />
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="regEmail" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="regPhone" placeholder="9876543210" maxlength="10" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="Min 6 characters" />
    </div>
    <button class="btn-primary" style="width:100%;margin-top:8px" onclick="handleRegister()" id="registerBtn">
      Create Account →
    </button>
    <div class="auth-footer">
      <a href="#" onclick="switchTab('login')">Already have an account? Login</a>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  function switchTab(tab) {
    document.getElementById('loginPanel').classList.toggle('active', tab === 'login');
    document.getElementById('registerPanel').classList.toggle('active', tab === 'register');
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
  }

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showToast('Please fill all fields', 'warning'); return; }
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Logging in…'; btn.disabled = true;
    try {
      const res = await AuthAPI.login(email, password);
      setAuth(res.token, res.user);
      showToast('Welcome back! 🎉', 'success');
      setTimeout(() => {
        window.location.href = res.user.role === 'admin' ? '/admin.html' : '/';
      }, 800);
    } catch (e) {
      showToast(e.message || 'Login failed', 'error');
      btn.textContent = 'Login to Zipp →'; btn.disabled = false;
    }
  }

  async function handleRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;
    if (!name || !email || !password) { showToast('Please fill all required fields', 'warning'); return; }
    if (password.length < 6) { showToast('Password must be at least 6 characters', 'warning'); return; }
    const btn = document.getElementById('registerBtn');
    btn.textContent = 'Creating account…'; btn.disabled = true;
    try {
      const res = await AuthAPI.register(name, email, password, phone);
      setAuth(res.token, res.user);
      showToast('Account created! Welcome to Zipp 🎉', 'success');
      setTimeout(() => { window.location.href = '/'; }, 800);
    } catch (e) {
      showToast(e.message || 'Registration failed', 'error');
      btn.textContent = 'Create Account →'; btn.disabled = false;
    }
  }

  async function demoLogin(role) {
    const credentials = role === 'admin'
      ? { email: 'admin@example.com', password: 'password123' }
      : { email: 'user@example.com', password: 'user123' };
    document.getElementById('loginEmail').value = credentials.email;
    document.getElementById('loginPassword').value = credentials.password;
    await handleLogin();
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const loginActive = document.getElementById('loginPanel').classList.contains('active');
      if (loginActive) handleLogin(); else handleRegister();
    }
  });

  // Redirect if already logged in
  if (isLoggedIn()) window.location.href = '/';
</script>
</body>
</html>
